<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#274e13">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ECODesk: máy tính có menu trái chia nhóm; điện thoại có thanh tab dưới, mục phụ nằm trong "Thêm" */
:root{
  --brand:#274e13; --brand-ink:#ffffff; --soft:#e6eedf; --accent:#274e13; --on-accent:#ffffff;
  --bg:#f4f6f1; --surface:#ffffff; --fg:#1b2416; --muted:#5f6b58; --line:#dde3d6;
  --ok:#2f7a28; --ok-bg:#e3f2de; --warn:#8a5a00; --warn-bg:#fff1cc; --bad:#b3261e; --bad-bg:#fde4e1; --info:#1f5c99; --info-bg:#e1ecf8;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#1c3a0d; --brand-ink:#eef5e8; --soft:#23331b; --accent:#9ccc74; --on-accent:#11160e;
  --bg:#11160e; --surface:#192114; --fg:#e7eee1; --muted:#9aa892; --line:#2c3a24;
  --ok:#8fd07f; --ok-bg:#1f3419; --warn:#f0c860; --warn-bg:#3a3010; --bad:#f2968d; --bad-bg:#3d1c19; --info:#8cbcf0; --info-bg:#172b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#1c3a0d; --brand-ink:#eef5e8; --soft:#23331b; --accent:#9ccc74; --on-accent:#11160e;
  --bg:#11160e; --surface:#192114; --fg:#e7eee1; --muted:#9aa892; --line:#2c3a24;
  --ok:#8fd07f; --ok-bg:#1f3419; --warn:#f0c860; --warn-bg:#3a3010; --bad:#f2968d; --bad-bg:#3d1c19; --info:#8cbcf0; --info-bg:#172b40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{background:var(--brand);color:var(--brand-ink);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;border:2px dashed currentColor;display:grid;place-items:center;font-size:8px;font-weight:700;text-align:center;line-height:1.1;opacity:.85;flex:none}
.top h1{font-size:18px;margin:0;font-weight:800}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:78vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.me b{display:block;line-height:1.2}.me span{font-size:12px;color:var(--muted)}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;width:100%}
.nav:hover{background:var(--soft)}
.nav[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:700}
.badge{margin-left:auto;background:var(--bad);color:var(--surface);border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
.side .spacer{flex:1}
.main{padding:20px 20px 48px;min-width:0;display:grid;gap:16px;align-content:start;max-width:1120px;width:100%}
.main h2{margin:0;font-size:22px;text-wrap:balance}
.lead{color:var(--muted);margin:2px 0 0;max-width:72ch}
.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
label.f{display:grid;gap:4px;font-weight:600;font-size:13px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=password],input[type=email],input[type=number],input[type=datetime-local],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.form{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.bad{background:var(--bad);color:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--soft);color:var(--muted)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.hint{font-size:12px;color:var(--muted)}
.ban{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--accent);white-space:nowrap}
.picker{display:grid;gap:8px}
.members{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;gap:2px}
.members label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.members label:hover{background:var(--soft)}
.members .ban{margin-left:auto}
.types{display:flex;gap:8px;flex-wrap:wrap}
.type{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.type b{display:block}.type span{font-size:12px;color:var(--muted)}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 12px;font-weight:600;display:inline-block}
/* Mail UCV kiểu Gmail */
.mail{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(0,1.3fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:440px}
.folders{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.folders .btn{margin-bottom:8px;justify-content:center}
.mlist{border-right:1px solid var(--line);overflow:auto;min-width:0}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.mi:hover,.mi[aria-current="true"]{background:var(--soft)}
.mi .t1{display:flex;gap:8px;justify-content:space-between}
.mi b,.mi .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mi .s{font-size:13px}.mi .d{font-size:12px;color:var(--muted);white-space:nowrap}
.mread{padding:16px;min-width:0;display:grid;gap:10px;align-content:start}
.mread h3{margin:0;font-size:17px}
.mread .body{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px}
.box{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
/* Thư mẫu BOD */
.tpl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:380px}
.tpl .folders{gap:2px}
.tlist{display:grid;align-content:start}
.titem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.titem > div{min-width:0;flex:1}
.titem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Wizard gửi hàng loạt */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;padding:6px 12px 6px 6px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600;font-size:13px;border:0;cursor:pointer}
.step span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:12px}
.step[aria-current="step"]{background:var(--accent);color:var(--on-accent)}
.step[aria-current="step"] span{color:var(--accent)}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.srcb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px}
.srcb b{display:flex;gap:8px;align-items:center}
.srcb span{font-size:12px;color:var(--muted)}
.srcb[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.ph{font-family:var(--f-num);font-size:12px;background:var(--info-bg);color:var(--info);padding:1px 6px;border-radius:5px}
.preview{border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;background:var(--bg)}
/* Báo cáo */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 22px var(--f-num);color:var(--accent)}
.kpi span{font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
/* Cài đặt dạng trang con */
.setsearch{position:relative}
.setsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.setsearch input{padding-left:34px}
.sgroup{display:grid;gap:6px}
.sgroup h4{margin:6px 4px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sitem{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;text-align:left;cursor:pointer}
.sitem:first-child{border-top:0}
.sitem:hover{background:var(--soft)}
.sitem .ic{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sitem > div{min-width:0;flex:1}
.sitem b{display:block}.sitem span{font-size:12px;color:var(--muted)}
.sitem .chev{color:var(--muted)}
.back{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.crumb{font-size:12px;color:var(--muted)}
.login{max-width:380px;margin:40px auto;display:grid;gap:14px}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-weight:600;cursor:pointer}
.or{text-align:center;color:var(--muted);font-size:12px}
.bottom{display:none}
.moresheet{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:30;display:flex;align-items:flex-end}
.moresheet .panel{background:var(--surface);width:100%;border-radius:16px 16px 0 0;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:2px}
@media (max-width:780px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 16px 96px}
  .bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
  .bottom button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 2px;position:relative}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .bottom .badge{position:absolute;top:0;right:22%;margin:0}
  .mail{grid-template-columns:1fr}
  .folders{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .folders .btn{margin:0}
  .folders .nav{width:auto}
  .mlist{border-right:0;border-bottom:1px solid var(--line);max-height:260px}
  .tpl{grid-template-columns:1fr}
}
.err{color:var(--bad);font-weight:600}
.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
[hidden]{display:none!important}
#subbody{display:grid;gap:14px}
.chimobile{display:none}
@media (max-width:780px){
  .chimobile{display:inline-flex}
  .mail.doc .mlist,.mail.doc .folders{display:none}
  .mail:not(.doc) .mread{display:none}
  .mail{min-height:0}
}
body{margin:0}
</style>

</head>
<body>
<div id="app"></div>
<script>
var I={
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',

 chev:'<path d="M9 6l6 6-6 6"/>',
 left:'<path d="M15 6l-6 6 6 6"/>',
 folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',

};

var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ic(n, s) { return '<svg class="i" viewBox="0 0 24 24" ' + (s ? 'style="width:' + s + 'px;height:' + s + 'px"' : '') + ' aria-hidden="true">' + I[n] + '</svg>'; }
function ngayGio(ms) { var d = new Date(ms); var p = function (x) { return ('0' + x).slice(-2); }; return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function ngayDayDu(ms) { var d = new Date(ms); var p = function (x) { return ('0' + x).slice(-2); }; return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function boDau(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }

/* ---------- Lưu phiên đăng nhập trên máy ---------- */
var PHIEN = null, NGUOI = null;
function luuPhien(p) { PHIEN = p; try { if (p) localStorage.setItem('eco_phien', p); else localStorage.removeItem('eco_phien'); } catch (e) {} }
function docPhienMay() { try { return localStorage.getItem('eco_phien'); } catch (e) { return null; } }

/* ---------- Gọi máy chủ ---------- */
function goi(ten) {
  var thamSo = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, loi) {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function (e) {
        if (String(e && e.message).indexOf('PHIEN_HET_HAN') >= 0) { luuPhien(null); NGUOI = null; shell(); loi(new Error('Phiên đăng nhập đã hết hạn, bạn đăng nhập lại nhé.')); return; }
        loi(e);
      })[ten].apply(null, thamSo);
  });
}
function goiPhien(ten) { return goi.apply(null, [ten, PHIEN].concat(Array.prototype.slice.call(arguments, 1))); }
function thongBao(el, loai, chu) { if (el) el.innerHTML = '<span class="' + (loai === 'ok' ? 'toast' : 'err') + '">' + esc(chu) + '</span>'; }

/* ---------- Menu theo vai trò ---------- */
var NAV = {
  BOD: [['Công việc', [['diem', 'Cộng điểm', 'star'], ['task', 'Task', 'check']]], ['Liên lạc', [['mail', 'Mail', 'mail'], ['gopy', 'Góp ý', 'chat']]], ['Theo dõi', [['baocao', 'Báo cáo', 'chart'], ['log', 'File đăng ký log', 'file']]], ['Hệ thống', [['caidat', 'Cài đặt', 'gear']]]],
  HR: [['Công việc', [['task', 'Task', 'check']]]],
  UCV: [['Liên lạc', [['mail', 'Mail', 'mail']]]]
};
var BOTTOM = { BOD: ['diem', 'task', 'mail', 'gopy'], HR: ['task'], UCV: ['mail'] };
var VAI_TRO = { BOD: 'Ban điều hành', HR: 'Ban nhân sự', UCV: 'Ứng cử viên' };
var page = null, sub = null, soGopYMoi = 0;
function flat() { return NAV[NGUOI.vaiTro].reduce(function (a, g) { return a.concat(g[1]); }, []); }

function shell() {

function bindPicker(id) {

  var dem = function () { el.querySelector('[data-cnt]').textContent = 'Đã chọn ' + el.querySelectorAll('.members input:checked').length; };

var ST_TASK = { 'Đã giao': 'p-info', 'Sắp đến hạn': 'p-warn', 'Trễ hạn': 'p-bad', 'Đã xong': 'p-ok', 'Đã huỷ': 'p-mute' };

}
function kichThuoc(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function veLuong(l, coTai) {
  return '<h3>' + esc(l.tieuDe) + '</h3><div class="row">' + l.nhan.map(function (n) { return '<span class="pill p-info">' + esc(n) + '</span>'; }).join('') + (l.trongThungRac ? '<span class="pill p-mute">Thùng rác</span>' : '') + (l.laThuRac ? '<span class="pill p-bad">Thư rác</span>' : '') + '</div>' +

function ganTaiDinhKem(maThu, msg) {
  Array.prototype.forEach.call(document.querySelectorAll('[data-tai]'), function (b) {

      b.disabled = true;
      goiPhien('taiDinhKem', maThu, b.getAttribute('data-tai'), Number(b.getAttribute('data-i'))).then(function (f) {
        b.disabled = false;
        var bin = atob(f.base64), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: f.loai })); a.download = f.ten;
        document.body.appendChild(a); a.click(); a.remove();
      }).catch(function (err) { b.disabled = false; thongBao(msg(), 'loi', err.message); });
    };
  });
}
function docTep(input) {
  return Promise.all(Array.prototype.map.call(input.files || [], function (f) {
    return new Promise(function (ok, loi) {
      if (f.size > 10 * 1048576) { loi(new Error('Tệp "' + f.name + '" lớn hơn 10MB.')); return; }
      var r = new FileReader();
      r.onload = function () { ok({ ten: f.name, loai: f.type || 'application/octet-stream', base64: String(r.result).split(',')[1] || '' }); };
      r.onerror = function () { loi(new Error('Không đọc được tệp ' + f.name)); };
      r.readAsDataURL(f);
    });
  }));
}
