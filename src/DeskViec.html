<script>
/* =================== Cộng điểm, task, báo cáo, file log, góp ý, cài đặt =================== */

/* ---------- Cộng điểm ---------- */
VIEWS.diem = function () {
  dangTai();
  goiPhien('layDuLieuCongDiem').then(function (d) {
    if (page !== 'diem') return;
    $('#main').innerHTML = '<div class="head"><div><h2>Cộng điểm</h2><p class="lead">' + (d.ky ? 'Nhiệm kỳ ' + esc(d.ky.nhiemKy) + ' · Học kỳ ' + d.ky.hocKy + '. ' : '') + 'Chọn loại hoạt động và những người được cộng. BOD không tham gia cộng điểm nên không có trong danh sách.</p></div></div>' +
      (d.ky ? '' : '<div class="note">' + ic('info') + '<span>Chưa có học kỳ nào. Hãy tải danh sách thành viên kiểu "Sau tuyển đợt 1" ở menu ECO hậu kỳ trong Google Sheet.</span></div>') +
      '<div class="diem-grid"><form class="card form" id="fd">' +
      '<div><div style="font-weight:600;font-size:13px;margin-bottom:8px">Loại hoạt động</div><div class="types" id="types">' +
      (d.loai.length ? d.loai.map(function (l, i) { return '<button type="button" class="type" aria-pressed="' + (i === 0) + '" data-t="' + esc(l.ten) + '"><b>' + esc(l.ten) + '</b><span>+' + l.diem + ' điểm</span></button>'; }).join('') : '<span class="hint">Chưa có loại hoạt động. Thêm trong Cài đặt.</span>') + '</div></div>' +
      '<label class="f">Tên hoạt động <small>Không bắt buộc</small><input type="text" id="actname" maxlength="200" placeholder="Ví dụ: Hội chợ xuân"></label>' +
      picker('pk', d.thanhVien) +
      '<div class="sticky-foot row"><button class="btn" id="cd-b">' + ic('star', 16) + 'Cộng điểm</button><span id="dmsg"></span></div></form>' +
      '<div class="card recent"><div class="ctitle"><h3>Vừa cộng gần đây</h3><span class="hint">Cộng nhầm thì bấm Xoá</span></div><div class="lst" id="ganday">' +
      (d.ganDay.length ? d.ganDay.map(function (r) {
        return '<div class="li"><div class="c"><b class="t">' + esc(r.ten) + '</b><span class="s">' + esc(r.loai) + (r.tenHoatDong ? ' · ' + esc(r.tenHoatDong) : '') + ' · ' + ngayGio(r.thoiGian) + ' · ' + esc(r.nguoiCong) + '</span></div><span class="num" style="font-weight:700;color:var(--accent)">+' + r.diem + '</span><button class="btn ghost sm" data-del="' + r.thoiGian + '" data-ten="' + esc(r.ten) + '">Xoá</button></div>';
      }).join('') : rong(ic('star') + 'Chưa có lần cộng nào trong học kỳ này.')) +
      '</div><div id="delm"></div></div></div>';
    var layChon = bindPicker('pk');
    $('#types').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; $$('#types .type').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); };
    $('#fd').onsubmit = function (e) {
      e.preventDefault();
      var loai = $('#types [aria-pressed=true]');
      var nguoi = layChon();
      if (!loai) { thongBao($('#dmsg'), 'loi', 'Chưa có loại hoạt động. Thêm trong Cài đặt.'); return; }
      if (!nguoi.length) { thongBao($('#dmsg'), 'loi', 'Bạn chưa chọn ai.'); return; }
      $('#cd-b').disabled = true; thongBao($('#dmsg'), 'cho', 'Đang lưu…');
      goiPhien('congDiem', { loai: loai.getAttribute('data-t'), tenHoatDong: $('#actname').value, nguoi: nguoi }).then(function (n) {
        VIEWS.diem(); setTimeout(function () { thongBao($('#dmsg'), 'ok', 'Đã cộng điểm ' + loai.getAttribute('data-t') + ' cho ' + n + ' người'); }, 900);
      }).catch(function (err) { $('#cd-b').disabled = false; thongBao($('#dmsg'), 'loi', err.message); });
    };
    $$('[data-del]').forEach(function (b) {
      b.onclick = function () {
        if (!xacNhan(b, 'Xoá thật?')) return;
        b.disabled = true;
        goiPhien('xoaDongDiem', Number(b.getAttribute('data-del')), b.getAttribute('data-ten')).then(function () { VIEWS.diem(); }).catch(function (err) { b.disabled = false; thongBao($('#delm'), 'loi', err.message); });
      };
    });
  }).catch(loiTai);
};

/* ---------- Task ---------- */
var ST_TASK = { 'Đã giao': ['p-info', ''], 'Sắp đến hạn': ['p-warn', 'st-sap'], 'Trễ hạn': ['p-bad', 'st-tre'], 'Đã xong': ['p-ok', 'st-xong'], 'Đã huỷ': ['p-mute', 'st-huy'] };
function hienNgay(s) { var p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : esc(s); }
function congNgay(s, n) { var p = s.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
/* ---------- Nhận thông báo (Zalo, app trên điện thoại, mail) ---------- */
VIEWS.task = function () {
  dangTai();
  goiPhien('layDuLieuTask').then(function (d) {
    if (page !== 'task') return;
    var loc = 'mo', tim = '';
    var laMo = function (t) { return t.trangThai !== 'Đã xong' && t.trangThai !== 'Đã huỷ'; };
    var hop = function (t, k) { return k === 'mo' ? laMo(t) : t.trangThai === k; };
    var dem = function (k) { return d.task.filter(function (t) { return hop(t, k); }).length; };
    var LOC = [['mo', 'Đang mở'], ['Sắp đến hạn', 'Sắp đến hạn'], ['Trễ hạn', 'Trễ hạn'], ['Đã xong', 'Đã xong'], ['Đã huỷ', 'Đã huỷ']];
    $('#main').innerHTML = '<div class="head"><div><h2>Task</h2><p class="lead">' + (NGUOI.vaiTro === 'HR' ? 'Task bạn tạo sẽ ghi là “nhập task”.' : 'Task BOD tạo ghi là “giao task”, task HR tạo ghi là “nhập task”.') + '</p></div><button class="btn" id="newt">' + ic('plus', 16) + 'Tạo task</button></div>' +
      (d.thongBao ? '<div id="zbox">' + dongThongBao(d.thongBao) + '</div>' : '') +
      '<div class="toolbar"><div class="seg" id="tfil">' + LOC.map(function (x) { return '<button data-f="' + x[0] + '" aria-pressed="' + (x[0] === loc) + '">' + x[1] + ' <span class="n">' + dem(x[0]) + '</span></button>'; }).join('') + '</div>' +
      '<input type="search" id="tq" placeholder="Tìm theo tên task hoặc người phụ trách…" aria-label="Tìm task"></div>' +
      '<div id="tam"></div><div class="tasks" id="tl"></div>' +
      '<p class="hint">“Đang mở” gồm mọi task chưa xong và chưa huỷ. “Sắp đến hạn” là còn ' + (d.sapDenHanNgay === 0 ? 'đúng ngày hạn' : d.sapDenHanNgay + ' ngày trở xuống') + '. Task đã xong hoặc đã huỷ được giữ ở đây 120 ngày.</p>';

    var ve = function () {
      var q = boDau(tim);
      var rows = d.task.filter(function (t) { return hop(t, loc) && (!q || boDau(t.ten + ' ' + t.nguoi).indexOf(q) >= 0); });
      $('#tl').innerHTML = rows.map(function (t) {
        var i = d.task.indexOf(t), mo = laMo(t), st = ST_TASK[t.trangThai] || ['p-mute', ''];
        return '<div class="task ' + st[1] + '"><div><div class="tt">' + esc(t.ten) + '</div>' + (t.moTa ? '<div class="md">' + esc(t.moTa) + '</div>' : '') +
          '<div class="meta"><span class="pill ' + st[0] + '">' + esc(t.trangThai) + '</span><span>' + ic('users', 14) + ' <b>' + esc(t.nguoi) + '</b></span><span>' + ic('clock', 14) + ' Hạn <b>' + hienNgay(t.hanChot) + '</b></span><span>' + esc(t.kieuTao) + ' bởi ' + esc(t.nguoiTao) + ' · ' + ngayGio(t.thoiGianTao) + '</span></div></div>' +
          '<div class="act">' + (mo ? '<button class="btn sm" data-st="Đã xong" data-i="' + i + '">' + ic('check', 14) + 'Đã xong</button><button class="btn ghost sm" data-edit="' + i + '">' + ic('edit', 14) + 'Sửa</button><button class="btn ghost sm" data-st="Đã huỷ" data-i="' + i + '">Huỷ</button>' : '<button class="btn ghost sm" data-st="Đã giao" data-i="' + i + '">Mở lại</button>') + '</div></div>';
      }).join('') || rong(ic('check') + 'Không có task nào.');
      $$('#tl [data-st]').forEach(function (b) {
        b.onclick = function () {
          var t = d.task[Number(b.getAttribute('data-i'))], st = b.getAttribute('data-st');
          if (st === 'Đã huỷ' && !xacNhan(b, 'Huỷ thật?')) return;
          b.disabled = true;
          goiPhien('doiTrangThaiTask', t.thoiGianTao, t.nguoi, st).then(function () { VIEWS.task(); }).catch(function (err) { b.disabled = false; thongBao($('#tam'), 'loi', err.message); });
        };
      });
      $$('#tl [data-edit]').forEach(function (b) { b.onclick = function () { moForm(d.task[Number(b.getAttribute('data-edit'))]); }; });
    };

    var moForm = function (t) {
      var h = moHop({
        tieuDe: t ? 'Sửa task' : 'Tạo task', lop: 'rong',
        than: '<form class="form" id="tf">' + (t ? '' : '<p class="hint" style="margin:0">Chọn nhiều người thì mỗi người nhận một task riêng với cùng nội dung.</p>') +
          '<div class="grid2"><label class="f">Tên task<input type="text" id="tn" maxlength="200" value="' + esc(t ? t.ten : '') + '" placeholder="Ví dụ: Chốt địa điểm workshop"></label>' +
          '<label class="f">Hạn chót<input type="date" id="td" value="' + (t ? t.hanChot : congNgay(d.homNay, 7)) + '"></label></div>' +
          '<label class="f">Mô tả <small>Không bắt buộc</small><textarea id="tdesc" rows="3" maxlength="2000">' + esc(t ? t.moTa : '') + '</textarea></label>' +
          (t ? '<label class="f">Người phụ trách<select id="tw">' + d.thanhVien.map(function (m) { return '<option' + (m.ten === t.nguoi ? ' selected' : '') + '>' + esc(m.ten) + '</option>'; }).join('') + '</select></label>' : picker('tp', d.thanhVien)) +
          '<button hidden></button></form>',
        chan: '<span class="msg" id="tmsg"></span><button class="btn ghost" data-dong>Đóng</button><button class="btn" id="tb">' + (t ? 'Lưu thay đổi' : 'Tạo task') + '</button>'
      });
      if (window.innerWidth <= 860) h.querySelector('.dlg').classList.add('full');
      var layChon = t ? null : bindPicker('tp');
      var gui = function (e) {
        if (e) e.preventDefault();
        var nd = { ten: $('#tn').value, moTa: $('#tdesc').value, hanChot: $('#td').value };
        $('#tb').disabled = true; thongBao($('#tmsg'), 'cho', 'Đang lưu…');
        var p = t ? goiPhien('suaTask', t.thoiGianTao, t.nguoi, { ten: nd.ten, moTa: nd.moTa, hanChot: nd.hanChot, nguoi: $('#tw').value })
          : goiPhien('taoTask', { ten: nd.ten, moTa: nd.moTa, hanChot: nd.hanChot, nguoi: layChon() });
        p.then(function (n) {
          dongHop(true); VIEWS.task(); setTimeout(function () { thongBao($('#tam'), 'ok', t ? 'Đã lưu task' : 'Đã tạo ' + n + ' task'); }, 900);
        }).catch(function (err) { $('#tb').disabled = false; thongBao($('#tmsg'), 'loi', err.message); });
      };
      $('#tf').onsubmit = gui; $('#tb').onclick = gui;
      if (window.innerWidth > 860) $('#tn').focus();
    };

    $('#newt').onclick = function () { moForm(null); };
    $('#tfil').onclick = function (e) { var b = e.target.closest('[data-f]'); if (!b) return; loc = b.getAttribute('data-f'); $$('#tfil button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); ve(); };
    $('#tq').oninput = function (e) { tim = e.target.value; ve(); };
    ve();
  }).catch(loiTai);
};

/* ---------- Báo cáo ---------- */
var MAU_DUONG = ['#3f8a2a', '#1f6fb5', '#c0392b', '#b07a00', '#7d4bb5', '#0f8c8c', '#c2185b', '#6b7a62'];
function veBieuDo(bd, chiSo, khoa, chon) {
  var W = 760, H = 260, L = 40, R = 26, T = 12, B = 34;
  var n = bd.moc.length;
  var max = 0;
  chon.forEach(function (c) { bd.chuoi[c].forEach(function (s) { max = Math.max(max, s[khoa] || 0); }); });
  var tran = max <= 4 ? 4 : Math.ceil(max / 4) * 4;
  var x = function (i) { return n <= 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1); };
  var y = function (v) { return T + (H - T - B) * (1 - v / tran); };
  var luoi = '';
  for (var g = 0; g <= 4; g++) { var gv = tran * g / 4; luoi += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(gv) + '" y2="' + y(gv) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(gv) + 4) + '" text-anchor="end">' + (Math.round(gv * 10) / 10) + '</text>'; }
  var buoc = Math.max(1, Math.ceil(n / 10));
  var nhan = bd.moc.map(function (m, i) { return i % buoc === 0 || i === n - 1 ? '<text x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle">' + esc(m.nhan) + '</text>' : ''; }).join('');
  var duong = chon.map(function (c, j) {
    var mau = MAU_DUONG[j % MAU_DUONG.length];
    var diem = bd.chuoi[c].map(function (s, i) { return x(i) + ',' + y(s[khoa] || 0); });
    return '<polyline fill="none" stroke="' + mau + '" stroke-width="2.2" points="' + diem.join(' ') + '"/>' + bd.chuoi[c].map(function (s, i) { return '<circle cx="' + x(i) + '" cy="' + y(s[khoa] || 0) + '" r="3" fill="' + mau + '"><title>' + esc(c + ' · ' + bd.moc[i].nhan + ': ' + (s[khoa] || 0)) + '</title></circle>'; }).join('');
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="Biểu đồ ' + esc((chiSo.filter(function (c) { return c.khoa === khoa; })[0] || {}).ten) + '">' + luoi + nhan + duong + '</svg>' +
    '<div class="row" style="gap:12px">' + chon.map(function (c, j) { return '<span class="hint" style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:3px;background:' + MAU_DUONG[j % MAU_DUONG.length] + ';display:inline-block"></span>' + esc(c) + '</span>'; }).join('') + '</div>';
}
function taiTep(f, loai) {
  var bin = atob(f.base64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: loai || f.loai || 'application/octet-stream' })); a.download = f.ten;
  document.body.appendChild(a); a.click(); a.remove();
}
VIEWS.baocao = function () {
  dangTai();
  goiPhien('layThongTinBaoCao').then(function (tt) {
    if (page !== 'baocao') return;
    var thangNay = tt.homNay.slice(0, 7);
    var B = { kieu: 'thang', cheDo: 'thanhvien', kq: null, sapXep: 'diem', tang: false, ban: 'Tất cả', tim: '', khoaBd: 'diem' };
    $('#main').innerHTML = '<div class="head"><div><h2>Báo cáo</h2><p class="lead">Chỉ tính thành viên đang trong CLB, không tính BOD. Chọn khoảng thời gian, xem bảng tổng hợp và biểu đồ thay đổi theo thời gian.</p></div></div>' +
      '<div class="card form"><div class="grid2" style="--o:190px">' +
      '<label class="f">Khoảng thời gian<select id="bk"><option value="thang">Tháng</option><option value="hocky">Học kỳ</option><option value="nhiemky">Nhiệm kỳ</option><option value="tuychon">Tự chọn</option></select></label>' +
      '<label class="f" id="bk-thang">Tháng<input type="month" id="bt" value="' + thangNay + '" max="' + thangNay + '"></label>' +
      '<label class="f" id="bk-hocky" hidden>Học kỳ<select id="bh">' + (tt.hocKy.length ? tt.hocKy.map(function (h, i) { return '<option value="' + i + '">' + esc(h.ten) + '</option>'; }).join('') : '<option value="">Chưa có học kỳ</option>') + '</select></label>' +
      '<label class="f" id="bk-nhiemky" hidden>Nhiệm kỳ<select id="bn">' + (tt.nhiemKy.length ? tt.nhiemKy.map(function (h, i) { return '<option value="' + i + '">' + esc(h.ten) + '</option>'; }).join('') : '<option value="">Chưa có nhiệm kỳ</option>') + '</select></label>' +
      '<label class="f" id="bk-tu" hidden>Từ ngày<input type="date" id="btu" value="' + thangNay + '-01"></label><label class="f" id="bk-den" hidden>Đến ngày<input type="date" id="bden" value="' + tt.homNay + '"></label></div>' +
      '<div class="row sb"><div class="seg" id="bcd"><button data-c="thanhvien" aria-pressed="true">Theo thành viên</button><button data-c="ban" aria-pressed="false">Theo ban</button><button data-c="clb" aria-pressed="false">Cả CLB</button></div>' +
      '<div class="row"><button class="btn" id="bx">' + ic('chart', 16) + 'Xem báo cáo</button><button class="btn ghost" id="be">' + ic('sheet', 16) + 'Xuất Excel</button></div></div><span id="bm"></span></div><div id="bkq" style="display:grid;gap:14px"></div>';
    var khoang = function () {
      if (B.kieu === 'thang') { var t = $('#bt').value; if (!t) return null; var p = t.split('-'); var cuoi = new Date(Date.UTC(+p[0], +p[1], 0)).toISOString().slice(0, 10); return { tu: t + '-01', den: cuoi < tt.homNay ? cuoi : tt.homNay, ten: 'Tháng ' + p[1] + '/' + p[0] }; }
      if (B.kieu === 'hocky') { var h = tt.hocKy[Number($('#bh').value)]; return h ? { tu: h.tu, den: h.den, ten: h.ten } : null; }
      if (B.kieu === 'nhiemky') { var n = tt.nhiemKy[Number($('#bn').value)]; return n ? { tu: n.tu, den: n.den, ten: n.ten } : null; }
      return { tu: $('#btu').value, den: $('#bden').value, ten: 'Từ ' + hienNgay($('#btu').value) + ' đến ' + hienNgay($('#bden').value) };
    };
    $('#bk').onchange = function () { B.kieu = $('#bk').value; ['thang', 'hocky', 'nhiemky'].forEach(function (k) { $('#bk-' + k).hidden = B.kieu !== k; }); $('#bk-tu').hidden = $('#bk-den').hidden = B.kieu !== 'tuychon'; };
    $('#bcd').onclick = function (e) { var b = e.target.closest('[data-c]'); if (!b) return; B.cheDo = b.getAttribute('data-c'); $$('#bcd button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); if (B.kq) xem(); };
    var xem = function () {
      var k = khoang();
      if (!k || !k.tu || !k.den) { thongBao($('#bm'), 'loi', 'Chọn khoảng thời gian.'); return; }
      $('#bx').disabled = true; thongBao($('#bm'), 'cho', 'Đang tính…');
      goiPhien('layBaoCao', k.tu, k.den, B.cheDo).then(function (kq) {
        $('#bx').disabled = false; $('#bm').innerHTML = ''; kq.khoang = k; kq.cheDo = B.cheDo; B.kq = kq;
        if (!kq.chiSo.some(function (c) { return c.khoa === B.sapXep; })) B.sapXep = 'diem';
        if (!kq.chiSo.some(function (c) { return c.khoa === B.khoaBd; })) B.khoaBd = 'diem';
        veKq();
      }).catch(function (err) { $('#bx').disabled = false; thongBao($('#bm'), 'loi', err.message); });
    };
    $('#bx').onclick = xem;
    $('#be').onclick = function () {
      var k = khoang();
      if (!k) { thongBao($('#bm'), 'loi', 'Chọn khoảng thời gian.'); return; }
      $('#be').disabled = true; thongBao($('#bm'), 'cho', 'Đang tạo file Excel…');
      goiPhien('xuatExcelBaoCao', k.tu, k.den, B.cheDo).then(function (f) {
        $('#be').disabled = false; taiTep(f, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); thongBao($('#bm'), 'ok', 'Đã tải ' + f.ten);
      }).catch(function (err) { $('#be').disabled = false; thongBao($('#bm'), 'loi', err.message); });
    };
    var veKq = function () {
      var kq = B.kq, cd = kq.cheDo;
      var nhomBan = [];
      if (cd === 'thanhvien') kq.bang.forEach(function (d) { var g = String(d.ban).trim().split(/\s+/)[0].toUpperCase(); if (g && nhomBan.indexOf(g) < 0) nhomBan.push(g); });
      var q = boDau(B.tim);
      var dong = kq.bang.filter(function (d) { return cd !== 'thanhvien' || ((B.ban === 'Tất cả' || String(d.ban).trim().split(/\s+/)[0].toUpperCase() === B.ban) && (!q || boDau(d.ten).indexOf(q) >= 0)); });
      var viTri = {}; kq.bang.forEach(function (d, i) { viTri[d.ten] = i; });
      dong.sort(function (a, b) { var va = a.so[B.sapXep] || 0, vb = b.so[B.sapXep] || 0; return (B.tang ? va - vb : vb - va) || (cd === 'ban' ? viTri[a.ten] - viTri[b.ten] : a.ten.localeCompare(b.ten, 'vi')); });
      var tong = {};
      kq.chiSo.forEach(function (c) { tong[c.khoa] = 0; dong.forEach(function (d) { tong[c.khoa] += d.so[c.khoa] || 0; }); });

          '<div class="card"><h3>Danh bạ khác</h3><p class="hint" style="margin-top:0">Ví dụ các CLB khác hay đối tác. Danh bạ dùng khi gửi hàng loạt và để UCV chọn người nhận. Nhóm giúp chọn cả nhóm một lần.</p><datalist id="dbn">' + ds.map(function (d) { return d.nhom; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; }).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist><div class="tscroll"><table><thead><tr><th>Nhóm</th><th>Tên</th><th>Email</th><th>Ghi chú</th><th></th></tr></thead><tbody>' +
          ds.map(function (d, i) { return '<tr><td><input type="text" id="dg' + i + '" list="dbn" value="' + esc(d.nhom) + '" aria-label="Nhóm"></td><td><input type="text" id="dt' + i + '" value="' + esc(d.ten) + '" aria-label="Tên"></td><td><input type="email" id="de' + i + '" value="' + esc(d.email) + '" aria-label="Email"></td><td><input type="text" id="dc' + i + '" value="' + esc(d.ghiChu) + '" aria-label="Ghi chú"></td><td><button class="ibtn" data-x="' + i + '" aria-label="Xoá">' + ic('trash', 16) + '</button></td></tr>'; }).join('') +
          '</tbody></table></div>' + (ds.length ? '' : '<p class="hint">Chưa có ai.</p>') + '<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="add">' + ic('plus', 14) + 'Thêm người</button><button class="btn sm" id="save">Lưu</button><span id="m"></span></div></div>';
        var doc = function () { ds = ds.map(function (_, i) { return { nhom: $('#dg' + i).value, ten: $('#dt' + i).value, email: $('#de' + i).value, ghiChu: $('#dc' + i).value }; }); };
        $('#add').onclick = function () { doc(); ds.push({ nhom: ds.length ? ds[ds.length - 1].nhom : '', ten: '', email: '', ghiChu: '' }); ve(); $('#dt' + (ds.length - 1)).focus(); };
        $$('[data-x]').forEach(function (b) { b.onclick = function () { doc(); ds.splice(Number(b.getAttribute('data-x')), 1); ve(); }; });
        $('#save').onclick = function () { doc(); luuVa($('#save'), $('#m'), 'luuDanhBa', [ds]); };
      };
      ve();
    }).catch(function (err) { $('#subbody').innerHTML = '<p class="err">' + esc(err.message) + '</p>'; });
  },
  logcfg: function () {
    $('#subbody').innerHTML = '<form class="card form" id="lc"><label class="f">Link Google Sheet mẫu <small>Bắt buộc. File đăng ký log được chép từ mẫu này. Dùng file mẫu của tool tạo file log cũ (có tab Đăng ký log, có thể có tab Kế hoạch): app điền giống hệt tool cũ. Mẫu khác cần một dòng tiêu đề có cột Họ và tên; các cột buổi được thêm ngay sau cột tiêu đề cuối cùng.</small><input type="url" id="lc-m" value="' + esc(CD.log.linkMau) + '" placeholder="https://docs.google.com/spreadsheets/d/…"></label>' +
      '<label class="f">Link thư mục Google Drive để lưu file <small>Bỏ trống thì lưu ở thư mục gốc Drive của tài khoản CLB</small><input type="url" id="lc-f" value="' + esc(CD.log.linkThuMuc) + '" placeholder="https://drive.google.com/drive/folders/…"></label>' +
      '<div class="row"><button class="btn sm" id="lc-b">Lưu</button><span id="m"></span></div></form>';
    $('#lc').onsubmit = function (e) { e.preventDefault(); luuVa($('#lc-b'), $('#m'), 'luuCaiDatLog', [{ linkMau: $('#lc-m').value, linkThuMuc: $('#lc-f').value }]); };
  },
  hr: function (vaiTro) {
    vaiTro = vaiTro === 'UCV' ? 'UCV' : 'HR';
    var hr = CD.taiKhoan.filter(function (t) { return t.vaiTro === vaiTro; });
    var daCo = {}; CD.taiKhoan.forEach(function (t) { daCo[t.email.toLowerCase()] = true; });
    var conLai = CD.thanhVien.filter(function (t) { return t.email && !daCo[t.email.toLowerCase()]; });
    $('#subbody').innerHTML = '<div class="card flush"><div style="padding:16px 18px 6px"><h3 style="margin:0">Đang có quyền</h3></div><div class="lst">' + (hr.length ? hr.map(function (t) { return '<div class="li"><div class="c"><b class="t">' + esc(t.ten) + '</b><span class="s">' + esc(t.email) + '</span></div><button class="btn ghost sm" data-go="' + esc(t.email) + '">Gỡ quyền</button></div>'; }).join('') : rong('Chưa có ai.')) + '</div><div style="padding:0 18px 12px" id="m1"></div></div>' +
      '<form class="card form" id="hf"><h3 style="margin:0">Thêm người</h3><label class="f">Thành viên <small>Chỉ hiện người có email trong danh sách và chưa có tài khoản</small><select id="hn">' + conLai.map(function (t) { return '<option>' + esc(t.ten) + '</option>'; }).join('') + '</select></label><label class="f">Mật khẩu ban đầu <small>Ít nhất 6 ký tự. Gửi riêng cho người đó, họ tự đổi sau. Nếu CLB đã bật đăng nhập bằng Google, họ có thể đăng nhập bằng Google luôn.</small><input type="text" id="hp" autocomplete="off"></label><div class="row"><button class="btn sm" id="hb"' + (conLai.length ? '' : ' disabled') + '>' + (vaiTro === 'UCV' ? 'Thêm UCV' : 'Thêm vào HR') + '</button><span id="m2"></span></div></form>';
    $$('[data-go]').forEach(function (b) { b.onclick = function () { if (!xacNhan(b, 'Gỡ thật?')) return; luuVa(b, $('#m1'), 'goTaiKhoan', [b.getAttribute('data-go')], function () { SUB.hr(vaiTro); }); }; });
    $('#hf').onsubmit = function (e) { e.preventDefault(); luuVa($('#hb'), $('#m2'), 'themBanNhanSu', [$('#hn').value, $('#hp').value, vaiTro], function () { SUB.hr(vaiTro); thongBao($('#m2'), 'ok', 'Đã thêm'); }); };
  },
  ucv: function () { SUB.hr('UCV'); },
  google: function () {
    $('#subbody').innerHTML = '<form class="card form" id="gg"><p style="margin:0">Khi bật, ai có tài khoản ECODesk có thể bấm “Đăng nhập bằng Google” thay vì gõ mật khẩu, với điều kiện email Google trùng email tài khoản. Nút này hiện khi mở ECODesk qua trang ecotdn.github.io/desk hoặc app đã cài.</p>' +
      '<label class="f">Google Client ID <small>Tạo một lần trên Google Cloud bằng tài khoản CLB (xem hướng dẫn bên dưới). Bỏ trống để tắt.</small><input type="text" id="gg-i" value="' + esc(CD.googleClientId) + '" placeholder="1234567890-abc….apps.googleusercontent.com"></label>' +
      '<div class="row"><button class="btn sm" id="gg-b">Lưu</button><span id="m"></span></div></form>' +
      '<details class="card"' + (CD.googleClientId ? '' : ' open') + '><summary style="cursor:pointer;font-weight:600">Hướng dẫn lấy Google Client ID (làm một lần)</summary><ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:6px">' +
      '<li>Trên máy tính, đăng nhập tài khoản Google của CLB, mở <b>console.cloud.google.com</b>. Lần đầu sẽ được hỏi đồng ý điều khoản, bấm đồng ý.</li>' +
      '<li>Ở góc trên bên trái bấm chọn dự án, bấm <b>New project</b>, đặt tên “ECODesk”, bấm <b>Create</b>, rồi chọn dự án vừa tạo.</li>' +
      '<li>Mở menu, vào <b>APIs &amp; Services</b> rồi <b>OAuth consent screen</b> (có thể tên là Google Auth Platform). Bấm <b>Get started</b>, điền tên app “ECODesk”, email hỗ trợ là email CLB, chọn <b>External</b>, điền email liên hệ, đồng ý rồi bấm <b>Create</b>.</li>' +
      '<li>Vào mục <b>Audience</b>, bấm <b>Publish app</b> để ai cũng đăng nhập được (chỉ xin email và tên nên Google không cần duyệt).</li>' +
      '<li>Vào mục <b>Clients</b> (hoặc Credentials), bấm <b>Create client</b>, chọn loại <b>Web application</b>, tên “ECODesk”.</li>' +
      '<li>Ở <b>Authorized JavaScript origins</b>, bấm Add URI và dán đúng: <code>https://ecotdn.github.io</code>. Bấm <b>Create</b>.</li>' +
      '<li>Sao chép <b>Client ID</b> (đuôi .apps.googleusercontent.com), dán vào ô ở trên, bấm Lưu.</li></ol></details>';
    $('#gg').onsubmit = function (e) { e.preventDefault(); luuVa($('#gg-b'), $('#m'), 'luuGoogleClientId', [$('#gg-i').value]); };
  },
  accounts: function () {
    $('#subbody').innerHTML = '<div class="card flush"><div class="lst">' + CD.taiKhoan.map(function (t, i) {
      return '<div class="li" style="flex-wrap:wrap"><div class="c" style="min-width:180px"><b class="t">' + esc(t.ten) + '</b><span class="s">' + (VAI_TRO[t.vaiTro] || esc(t.vaiTro)) + ' · ' + esc(t.email) + '</span></div><div class="row" style="flex-wrap:nowrap"><input type="text" id="np' + i + '" placeholder="Mật khẩu mới" aria-label="Mật khẩu mới cho ' + esc(t.ten) + '" style="max-width:170px"><button class="btn ghost sm" data-rs="' + i + '">Đặt lại</button></div></div>';
    }).join('') + '</div><div style="padding:0 18px 12px" id="m"></div></div>';
    $$('[data-rs]').forEach(function (b) {
      b.onclick = function () { var i = b.getAttribute('data-rs'); var t = CD.taiKhoan[i]; luuVa(b, $('#m'), 'datLaiMatKhau', [t.email, $('#np' + i).value], function () { $('#np' + i).value = ''; thongBao($('#m'), 'ok', 'Đã đặt lại mật khẩu cho ' + t.ten); }); };
    });
  }
};
</script>
