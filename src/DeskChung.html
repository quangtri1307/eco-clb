var $ = function (s) { return document.querySelector(s); };
var $$ = function (s, goc) { return Array.prototype.slice.call((goc || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ic(n, s) { return '<svg class="i" viewBox="0 0 24 24" ' + (s ? 'style="width:' + s + 'px;height:' + s + 'px"' : '') + ' aria-hidden="true">' + I[n] + '</svg>'; }
function p2(x) { return ('0' + x).slice(-2); }
function ngayGio(ms) { var d = new Date(ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function ngayDayDu(ms) { var d = new Date(ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function ngayNgan(ms) { var d = new Date(ms), n = new Date(); return d.toDateString() === n.toDateString() ? p2(d.getHours()) + ':' + p2(d.getMinutes()) : p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + (d.getFullYear() !== n.getFullYear() ? '/' + d.getFullYear() : ''); }
function boDau(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
function chuCai(ten) { return String(ten || '?').trim().split(/\s+/).pop().charAt(0).toUpperCase(); }
function rong(html) { return '<div class="empty">' + html + '</div>'; }
/** Nút bấm hai lần để xác nhận việc khó hoàn tác (xoá, huỷ). Trả về true nếu đã xác nhận. */
function xacNhan(b, chu) {
  if (b.getAttribute('data-ok') === '1') return true;
  b.setAttribute('data-ok', '1'); b.textContent = chu || 'Bấm lần nữa để chắc chắn'; b.classList.add('bad');
  setTimeout(function () { if (b.isConnected && b.getAttribute('data-ok') === '1') { b.removeAttribute('data-ok'); } }, 5000);
  return false;
}

/* ---------- Giao diện sáng / tối ---------- */
var GIAO_DIEN = (function () { try { return localStorage.getItem('eco_giao_dien') || 'auto'; } catch (e) { return 'auto'; } })();
function apGiaoDien() {
  if (GIAO_DIEN === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', GIAO_DIEN);
  var toi = GIAO_DIEN === 'dark' || (GIAO_DIEN === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var bien = function (t) { try { return getComputedStyle(document.documentElement).getPropertyValue(t).trim(); } catch (e) { return ''; } };
  // Màu thanh trạng thái (trên) và màu thanh tab (dưới) để trang vỏ tô phần tai thỏ, thanh vuốt cho liền với app.
  guiVo({ eco: 'mau', mau: toi ? '#1b3410' : '#274e13', nen: bien('--bg') || (toi ? '#11160e' : '#f4f6f1'), chan: bien('--surface') || (toi ? '#192114' : '#ffffff') });
}
/** Đổi giao diện; nhớ trên máy và theo tài khoản (mở ở máy khác vẫn đúng giao diện đã chọn). */
function datGiaoDien(k, khongLuu) {
  GIAO_DIEN = ['light', 'dark'].indexOf(k) >= 0 ? k : 'auto';
  try { localStorage.setItem('eco_giao_dien', GIAO_DIEN); } catch (e) {}
  apGiaoDien();
  if (!khongLuu && NGUOI) { NGUOI.giaoDien = GIAO_DIEN; goiPhien('luuGiaoDien', GIAO_DIEN).catch(function () {}); }
}
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (GIAO_DIEN === 'auto') apGiaoDien(); }); } catch (e) {} }

/* ---------- Trang vỏ (app cài trên điện thoại/máy tính): khoảng an toàn, ghi nhớ đăng nhập, đăng nhập Google ---------- */
var GOOGLE_CLIENT_ID = window.ECO_GOOGLE_CLIENT_ID || '';
var coVo = false, nguonVo = null, goiVo = '', VO_TB = 'khong', choThongBao = null;
function guiVo(d) { if (nguonVo) { try { nguonVo.postMessage(d, goiVo); } catch (e) {} } }
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object' || !/^https:\/\//.test(e.origin) || e.source !== window.top) return;
  if (d.eco === 'vo') {
    var dau = !coVo;
    coVo = true; nguonVo = e.source; goiVo = e.origin;
    if (d.thongBao) VO_TB = String(d.thongBao);
    if (d.vien) ['t', 'b', 'l', 'r'].forEach(function (k) { document.documentElement.style.setProperty('--sa' + k, (Number(d.vien[k]) || 0) + 'px'); });
    if (dau) {
      guiVo({ eco: 'ho-tro-vien' });
      apGiaoDien();
      // Phiên lưu ở trang vỏ bền hơn (điện thoại hay xoá dữ liệu của khung bên trong).
      if (!NGUOI && !PHIEN && d.phien) moPhien(String(d.phien));
      else if (PHIEN) guiVo({ eco: 'phien', phien: PHIEN });
      if (!NGUOI && $('#lf')) shell();
    }
    return;
  }
  if ((d.eco === 'dang-ky-thong-bao' || d.eco === 'thong-bao-loi') && choThongBao) {
    var cho = choThongBao; choThongBao = null;
    if (d.eco === 'thong-bao-loi') cho.loi(new Error(String(d.loi || 'Không bật được thông báo.')));
    else cho.ok({ diaChi: String(d.diaChi || ''), khoa: String(d.khoa || ''), tenMay: String(d.tenMay || '') });
    return;
  }
  if (d.eco === 'google-token' && d.token && !NGUOI) {
    if ($('#lg-m')) $('#lg-m').innerHTML = '<span class="hint">Đang đăng nhập…</span>';
    goi('dangNhapGoogle', d.token).then(daDangNhap).catch(function (err) { thongBao($('#lg-m'), 'loi', err.message); });
  }
});
if (window.top !== window) { try { window.top.postMessage({ eco: 'xin-chao' }, '*'); } catch (e) {} }

/** Nhờ trang vỏ xin quyền thông báo và đăng ký máy này. Trả về { diaChi, khoa, tenMay }. */
function batThongBaoMay(khoaCong) {
  return new Promise(function (ok, loi) {
    choThongBao = { ok: ok, loi: loi };
    guiVo({ eco: 'bat-thong-bao', khoaCong: khoaCong });
  });
}

function logoHtml() { return window.ECO_LOGO ? '<img src="' + window.ECO_LOGO + '" alt="">' : 'ECO'; }

/* ---------- Lưu phiên đăng nhập trên máy ---------- */
var PHIEN = null, NGUOI = null;
function luuPhien(p) {
  PHIEN = p;
  try { if (p) localStorage.setItem('eco_phien', p); else localStorage.removeItem('eco_phien'); } catch (e) {}
  guiVo({ eco: 'phien', phien: p || '' });
}
function docPhienMay() { try { return localStorage.getItem('eco_phien'); } catch (e) { return null; } }
function vaoApp(u) { NGUOI = u; if (u.giaoDien && u.giaoDien !== GIAO_DIEN) datGiaoDien(u.giaoDien, true); shell(); demGopYMoi(); }
function daDangNhap(kq) { luuPhien(kq.phien); page = null; vaoApp(kq.nguoiDung); }
function moPhien(p) {
  PHIEN = p;
  $('#app').innerHTML = '<div class="login-wrap"><p style="color:#fff">Đang mở ECODesk…</p></div>';
  goi('layNguoiDung', p).then(function (u) {
    if (!u) { luuPhien(null); NGUOI = null; shell(); return; }
    luuPhien(p); vaoApp(u);
  }).catch(function () { PHIEN = null; shell(); });
}

/* ---------- Gọi máy chủ ---------- */
function goi(ten) {
  var thamSo = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, loi) {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function (e) {
        if (String(e && e.message).indexOf('PHIEN_HET_HAN') >= 0) { luuPhien(null); NGUOI = null; dongHop(); shell(); loi(new Error('Phiên đăng nhập đã hết hạn, bạn đăng nhập lại nhé.')); return; }
        loi(e);
      })[ten].apply(null, thamSo);
  });
}
function goiPhien(ten) { return goi.apply(null, [ten, PHIEN].concat(Array.prototype.slice.call(arguments, 1))); }
function thongBao(el, loai, chu) { if (el) el.innerHTML = '<span class="' + (loai === 'ok' ? 'toast' : loai === 'cho' ? 'hint' : 'err') + '">' + esc(chu) + '</span>'; }

/* ---------- Hộp thoại: giữa màn hình trên máy tính, trượt từ dưới lên trên điện thoại ---------- */
function moHop(o) {
  dongHop();
  var ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'hop';
  ov.innerHTML = '<div class="dlg ' + (o.lop || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.tieuDe || '') + '">' +
    (o.tieuDe !== undefined ? '<div class="dlg-h"><h3>' + esc(o.tieuDe) + '</h3>' + (o.nutDau || '') + '<button class="ibtn" data-dong aria-label="Đóng">' + ic('x') + '</button></div>' : '') +
    '<div class="dlg-b">' + (o.than || '') + '</div>' + (o.chan ? '<div class="dlg-f">' + o.chan + '</div>' : '') + '</div>';
  ov.addEventListener('mousedown', function (e) { if (e.target === ov && !o.giu) dongHop(); });
  ov.addEventListener('click', function (e) { if (e.target.closest('[data-dong]')) dongHop(); });
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  ov.truocKhiDong = o.truocKhiDong || null;
  return ov;
}
function dongHop(epBuoc) {
  var h = $('#hop');
  if (!h) return true;
  if (!epBuoc && h.truocKhiDong && h.truocKhiDong() === false) return false;
  h.remove(); document.body.style.overflow = '';
  return true;
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#hop')) dongHop(); });

/* ---------- Menu theo vai trò ---------- */
var NAV = {
  BOD: [['Công việc', [['diem', 'Cộng điểm', 'star'], ['task', 'Task', 'check']]], ['Liên lạc', [['mail', 'Mail', 'mail'], ['gopy', 'Góp ý', 'chat']]], ['Theo dõi', [['baocao', 'Báo cáo', 'chart'], ['log', 'File đăng ký log', 'file']]], ['Hệ thống', [['caidat', 'Cài đặt', 'gear']]]],
  HR: [['Công việc', [['task', 'Task', 'check']]]],
  UCV: [['Liên lạc', [['mail', 'Mail', 'mail']]]]
};
var BOTTOM = { BOD: ['diem', 'task', 'mail', 'gopy'], HR: [], UCV: [] };
var VAI_TRO = { BOD: 'BOD', HR: 'Ban nhân sự', UCV: 'UCV' };
var page = null, sub = null, soGopYMoi = 0, soViecCho = 0;
var MENU_GON = (function () { try { return localStorage.getItem('eco_menu_gon') === '1'; } catch (e) { return false; } })();
function flat() { return NAV[NGUOI.vaiTro].reduce(function (a, g) { return a.concat(g[1]); }, []); }
function tenTrang(k) { if (k === 'menu') return 'Menu'; return (flat().filter(function (x) { return x[0] === k; })[0] || [0, 'ECODesk'])[1]; }
function soHuyHieu(k) { return k === 'gopy' ? soGopYMoi : k === 'mail' ? soViecCho : 0; }
function huyHieu(k) { var n = soHuyHieu(k); return n ? '<span class="badge">' + n + '</span>' : ''; }

function shell() {
  if (!NGUOI) { $('#app').innerHTML = loginView(); bindLogin(); return; }
  var items = flat();
  if (!page || (page !== 'menu' && !items.some(function (x) { return x[0] === page; }))) page = items[0][0];
  var bot = BOTTOM[NGUOI.vaiTro];
  var coTab = items.length > 1;
  var av = '<span class="av" aria-hidden="true">' + esc(chuCai(NGUOI.ten)) + '</span>';
  $('#app').innerHTML = '<div class="app' + (MENU_GON ? ' gon' : '') + (coTab ? '' : ' motab') + '" id="khungapp">' +
    '<aside class="side"><div class="sb-top"><div class="logo" aria-hidden="true">' + logoHtml() + '</div><b class="sb-name">ECODesk</b><button class="sb-thu" id="thugon" title="' + (MENU_GON ? 'Mở rộng menu' : 'Thu gọn menu') + '" aria-label="Thu gọn hoặc mở rộng menu">' + ic('dleft', 18) + '</button></div>' +
    '<nav class="sb-nav">' + NAV[NGUOI.vaiTro].map(function (g) {
      return '<div class="grp">' + g[0] + '</div>' + g[1].map(function (x) { return '<button class="nav" data-p="' + x[0] + '" title="' + x[1] + '"' + (x[0] === page ? ' aria-current="page"' : '') + '>' + ic(x[2]) + '<span class="t">' + x[1] + '</span>' + huyHieu(x[0]) + '</button>'; }).join('');
    }).join('') + '</nav>' +
    '<div class="sb-user"><button class="sb-me" data-acc title="Tài khoản">' + av + '<span class="who"><b>' + esc(NGUOI.ten) + '</b><span>' + VAI_TRO[NGUOI.vaiTro] + '</span></span><span class="more">' + ic('dots', 18) + '</span></button></div></aside>' +
    '<div class="wrap"><header class="topbar"><div class="logo" aria-hidden="true">' + logoHtml() + '</div><h1 id="tieude">' + esc(tenTrang(page)) + '</h1><button class="av" data-p="menu" aria-label="Menu và tài khoản">' + esc(chuCai(NGUOI.ten)) + '</button></header>' +
    '<main class="main" id="main"></main></div>' +
    (coTab ? '<nav class="bottom">' + bot.map(function (k) { var x = items.filter(function (y) { return y[0] === k; })[0]; return '<button data-p="' + k + '"' + (k === page ? ' aria-current="page"' : '') + '><span class="ic">' + ic(x[2], 22) + '</span>' + x[1] + huyHieu(k) + '</button>'; }).join('') +
      '<button data-more' + (bot.indexOf(page) < 0 ? ' aria-current="page"' : '') + '><span class="ic">' + ic('menu', 22) + '</span>Menu</button></nav>' : '') + '</div>';
  $('#thugon').onclick = function () { MENU_GON = !MENU_GON; try { localStorage.setItem('eco_menu_gon', MENU_GON ? '1' : '0'); } catch (e) {} $('#khungapp').classList.toggle('gon', MENU_GON); this.title = MENU_GON ? 'Mở rộng menu' : 'Thu gọn menu'; };
  $('#main').className = 'main';
  (VIEWS[page] || VIEWS.sapco)();
}
function diToi(k, s) {
  page = k; sub = s || null;
  $$('[data-p]').forEach(function (b) { if (b.getAttribute('data-p') === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  var them = $('[data-more]');
  if (them) { if (BOTTOM[NGUOI.vaiTro].indexOf(page) < 0) them.setAttribute('aria-current', 'page'); else them.removeAttribute('aria-current'); }
  if ($('#tieude')) $('#tieude').textContent = tenTrang(page);
  $('#main').className = 'main';
  window.scrollTo(0, 0);
  (VIEWS[page] || VIEWS.sapco)();
}

/** Khối chọn giao diện sáng / tối / theo máy. */
function chonGiaoDien() {
  return '<div class="seg" id="gd" style="width:100%">' + [['light', 'sun', 'Sáng'], ['dark', 'moon', 'Tối'], ['auto', 'auto', 'Theo máy']].map(function (x) {
    return '<button data-gd="' + x[0] + '" aria-pressed="' + (GIAO_DIEN === x[0]) + '" style="flex:1;justify-content:center">' + ic(x[1], 16) + x[2] + '</button>';
  }).join('') + '</div>';
}
function ganGiaoDien(goc) {
  $$('[data-gd]', goc).forEach(function (b) { b.onclick = function () { datGiaoDien(b.getAttribute('data-gd')); $$('[data-gd]', goc).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
}
function khoiTaiKhoan(chiTen) {
  if (chiTen) return '<div class="who-card"><span class="av" style="width:44px;height:44px;font-size:18px">' + esc(chuCai(NGUOI.ten)) + '</span><div><b>' + esc(NGUOI.ten) + '</b><span class="hint">' + VAI_TRO[NGUOI.vaiTro] + ' · ' + esc(NGUOI.email) + '</span></div></div>';
  return '<div class="who-card"><span class="av" style="width:44px;height:44px;font-size:18px">' + esc(chuCai(NGUOI.ten)) + '</span><div><b>' + esc(NGUOI.ten) + '</b><span class="hint">' + VAI_TRO[NGUOI.vaiTro] + ' · ' + esc(NGUOI.email) + '</span></div></div>' +
    '<div class="sheet-sec">Giao diện</div>' + chonGiaoDien() +
    '<div class="sheet-sec">Tài khoản</div><div class="menu"><button class="mi2" data-mk><span class="ic">' + ic('key') + '</span>Đổi mật khẩu</button><button class="mi2 bad" data-out><span class="ic">' + ic('out') + '</span>Đăng xuất</button></div>';
}
function moTaiKhoan() {
  var h = moHop({ tieuDe: 'Tài khoản', than: khoiTaiKhoan(), lop: '' });
  h.querySelector('.dlg').style.maxWidth = '420px';
  ganGiaoDien(h);
}
/** Trang Menu trên điện thoại: mọi chức năng, tài khoản, giao diện, thông báo. */
function viewMenu() {
  var ds = flat();
  var coTB = NGUOI.vaiTro === 'BOD' || NGUOI.vaiTro === 'HR';
  $('#main').innerHTML = '<div class="menu-trang">' + khoiTaiKhoan(true) +
    '<div class="sheet-sec">Chức năng</div><div class="mlist2">' + ds.map(function (x) { return '<button class="mi2" data-p="' + x[0] + '"><span class="ic">' + ic(x[2]) + '</span><span class="t">' + x[1] + '</span>' + huyHieu(x[0]) + ic('right', 16) + '</button>'; }).join('') + '</div>' +
    '<div class="sheet-sec">Giao diện</div>' + chonGiaoDien() +
    '<div class="sheet-sec">Tài khoản</div><div class="mlist2">' +
    (coTB ? '<button class="mi2" id="mn-tb"><span class="ic">' + ic('bell') + '</span><span class="t">Nhận thông báo</span>' + ic('right', 16) + '</button>' : '') +
    '<button class="mi2" data-mk><span class="ic">' + ic('key') + '</span><span class="t">Đổi mật khẩu</span>' + ic('right', 16) + '</button>' +
    '<button class="mi2 bad" data-out><span class="ic">' + ic('out') + '</span><span class="t">Đăng xuất</span></button></div></div>';
  ganGiaoDien($('#main'));
  if ($('#mn-tb')) $('#mn-tb').onclick = function () { moThongBao(); };
}
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-out]')) { dongHop(true); goi('dangXuat', PHIEN).catch(function () {}); luuPhien(null); NGUOI = null; page = null; shell(); return; }
  if (e.target.closest('[data-more]')) { if (!dongHop()) return; diToi('menu'); return; }
  if (e.target.closest('[data-acc]')) { moTaiKhoan(); return; }
  if (e.target.closest('[data-mk]')) { moDoiMatKhau(); return; }
  var p = e.target.closest('[data-p]');
  if (p && NGUOI) { if (!dongHop()) return; diToi(p.getAttribute('data-p')); }
});

/* ---------- Đăng nhập ---------- */
var LOGO_G = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 01-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0012 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 010-4.6V6.6H1.3a12 12 0 000 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 001.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>';
function loginView() {
  var coGoogle = coVo && GOOGLE_CLIENT_ID;
  return '<div class="login-wrap"><div class="login"><div class="brand"><div class="logo" aria-hidden="true">' + logoHtml() + '</div><div><h2>Đăng nhập ECODesk</h2><p class="hint" style="margin:4px 0 0">Dành cho BOD, ban nhân sự và UCV.</p></div></div>' +
    (coGoogle ? '<button type="button" class="gbtn" id="lg-g">' + LOGO_G + 'Đăng nhập bằng Google</button><div class="or">hoặc dùng mật khẩu</div>' : '') +
    '<form class="form" id="lf"><label class="f">Email<input type="email" id="lg-e" autocomplete="username" required></label>' +
    '<label class="f">Mật khẩu<input type="password" id="lg-p" autocomplete="current-password" required></label>' +
    '<button class="btn" id="lg-b" style="padding:11px">Đăng nhập</button>' +
    '<span id="lg-m"></span>' +
    '<p class="hint" style="margin:0">ECODesk ghi nhớ đăng nhập trên máy này, lần sau mở là vào thẳng. Dùng máy chung thì nhớ bấm Đăng xuất.</p>' +
    '<p class="hint" style="margin:0">Quên mật khẩu? Nhờ một BOD đặt lại cho bạn.</p></form></div></div>';
}
function bindLogin() {
  if ($('#lg-g')) $('#lg-g').onclick = function () { guiVo({ eco: 'dang-nhap-google', clientId: GOOGLE_CLIENT_ID }); };
  $('#lf').onsubmit = function (e) {
    e.preventDefault();
    $('#lg-b').disabled = true; $('#lg-m').innerHTML = '<span class="hint">Đang đăng nhập…</span>';
    goi('dangNhap', $('#lg-e').value, $('#lg-p').value).then(daDangNhap)
      .catch(function (err) { $('#lg-b').disabled = false; thongBao($('#lg-m'), 'loi', err.message); });
  };
}
function moDoiMatKhau() {
  var h = moHop({ tieuDe: 'Đổi mật khẩu', than: '<form class="form" id="pf"><label class="f">Mật khẩu hiện tại<input type="password" id="p0" autocomplete="current-password"></label><label class="f">Mật khẩu mới <small>Ít nhất 6 ký tự</small><input type="password" id="p1" autocomplete="new-password"></label><label class="f">Nhập lại mật khẩu mới<input type="password" id="p2" autocomplete="new-password"></label>' +
    (NGUOI.vaiTro === 'BOD' ? '<p class="hint" style="margin:0">Muốn đặt lại mật khẩu cho người khác, vào Cài đặt, Tài khoản và mật khẩu.</p>' : '') + '<button hidden></button></form>',
    chan: '<span class="msg" id="pm"></span><button class="btn ghost" data-dong>Đóng</button><button class="btn" id="pb">Đổi mật khẩu</button>' });
  h.querySelector('.dlg').style.maxWidth = '440px';
  var gui = function (e) {
    if (e) e.preventDefault();
    if ($('#p1').value !== $('#p2').value) { thongBao($('#pm'), 'loi', 'Hai lần nhập mật khẩu mới không khớp.'); return; }
    $('#pb').disabled = true;
    goiPhien('doiMatKhau', $('#p0').value, $('#p1').value).then(function () { $('#pb').disabled = false; $('#pf').reset(); thongBao($('#pm'), 'ok', 'Đã đổi mật khẩu'); })
      .catch(function (err) { $('#pb').disabled = false; thongBao($('#pm'), 'loi', err.message); });
  };
  $('#pf').onsubmit = gui; $('#pb').onclick = gui;
}
function demGopYMoi() {
  if (!NGUOI || NGUOI.vaiTro !== 'BOD') return;
  goiPhien('layGopY').then(function (ds) { soGopYMoi = ds.filter(function (g) { return !g.daDoc; }).length; capNhatHuyHieu(); }).catch(function () {});
  goiPhien('demViecChoDuyet').then(function (n) { soViecCho = n; capNhatHuyHieu(); }).catch(function () {});
}
/** Cập nhật số trên menu mà không vẽ lại trang. */
function capNhatHuyHieu() {
  ['gopy', 'mail'].forEach(function (k) {
    var n = soHuyHieu(k);
    $$('[data-p="' + k + '"]').forEach(function (b) {
      var c = b.querySelector('.badge');
      if (!n) { if (c) c.remove(); return; }
      if (!c) { c = document.createElement('span'); c.className = 'badge'; b.appendChild(c); }
      c.textContent = n;
    });
  });
}

/* ---------- Chọn người (dùng chung) ---------- */
function picker(id, thanhVien, chonHet) {
  var nhom = [];
  thanhVien.forEach(function (t) { if (t.nhom && nhom.indexOf(t.nhom) < 0) nhom.push(t.nhom); });
  nhom.sort();
  return '<div class="picker" id="' + id + '"><div class="row sb"><b style="font-size:13px">Chọn người</b><span class="hint" data-cnt></span></div>' +
    '<div class="row"><input type="search" id="' + id + '-q" placeholder="Tìm tên…" aria-label="Tìm thành viên" class="pk-tim">' +
    '<div class="row" data-bans>' + ['Tất cả'].concat(nhom).map(function (b, i) { return '<button type="button" class="chip" aria-pressed="' + (i === 0) + '" data-b="' + esc(b) + '">' + esc(b) + '</button>'; }).join('') + '</div></div>' +
    '<div class="members">' + (thanhVien.length ? thanhVien.map(function (t, i) { return '<label data-ban="' + esc(t.nhom) + '"><input type="checkbox" id="' + id + '-m' + i + '" value="' + esc(t.ten) + '"' + (chonHet ? ' checked' : '') + '><span class="t">' + esc(t.ten) + '</span><span class="ban">' + esc(t.ban) + '</span></label>'; }).join('') : '<p class="hint" style="padding:6px">Chưa có danh sách thành viên.</p>') + '</div>' +
    '<div class="row"><button type="button" class="btn ghost sm" data-all>Chọn tất cả đang hiện</button><button type="button" class="btn ghost sm" data-none>Bỏ chọn hết</button></div></div>';
}
function bindPicker(id) {
  var el = $('#' + id), ban = 'Tất cả', q = '';
  var loc = function () { $$('.members label', el).forEach(function (l) { l.hidden = !((ban === 'Tất cả' || l.getAttribute('data-ban') === ban) && boDau(l.textContent).indexOf(q) >= 0); }); };
  var dem = function () { el.querySelector('[data-cnt]').textContent = 'Đã chọn ' + el.querySelectorAll('.members input:checked').length + ' / ' + el.querySelectorAll('.members input').length; };
  el.querySelector('[data-bans]').onclick = function (e) { var b = e.target.closest('[data-b]'); if (!b) return; ban = b.getAttribute('data-b'); $$('[data-b]', el).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); loc(); };
  $('#' + id + '-q').oninput = function (e) { q = boDau(e.target.value); loc(); };
  el.querySelector('.members').onchange = dem;
  el.querySelector('[data-all]').onclick = function () { $$('.members label:not([hidden]) input', el).forEach(function (i) { i.checked = true; }); dem(); };
  el.querySelector('[data-none]').onclick = function () { $$('.members input', el).forEach(function (i) { i.checked = false; }); dem(); };
  dem();
  return function () { return $$('.members input:checked', el).map(function (i) { return i.value; }); };
}

var VIEWS = {};
function dangTai() { $('#main').innerHTML = '<p class="muted" style="padding:20px 0">Đang tải…</p>'; }
function loiTai(err) { $('#main').innerHTML = '<p class="err">' + esc(err.message) + '</p>'; }
VIEWS.menu = viewMenu;
VIEWS.sapco = function () { $('#main').innerHTML = '<div class="card"><p style="margin:0">Phần này đang được xây dựng.</p></div>'; };
</script>
