<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="theme-color" content="#274e13">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --brand:#274e13; --brand-ink:#ffffff; --brand-soft:#e6eedf; --accent:#274e13;
  --bg:#f5f7f2; --surface:#ffffff; --fg:#1b2416; --muted:#5f6b58; --line:#dde3d6;
  --gold:#a0770c; --silver:#6b7280; --bronze:#9a5a2b; --bad:#b3261e;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);overscroll-behavior:none}
body{min-height:100vh;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
.btn-link{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:10px}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:var(--sab)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
header{background:var(--brand);color:var(--brand-ink);padding-block:calc(12px + var(--sat)) 12px}
.head{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;padding:4px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
h1{font-size:22px;font-weight:800;margin:0;line-height:1.2}
.term{font-size:13px;opacity:.85;margin:0}
nav{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{flex:1 1 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font:600 14px var(--f-body);white-space:nowrap;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 40px;display:grid;gap:16px}
main>section{display:grid;gap:14px;min-width:0}
.list.tops{border:0;border-radius:0;margin:0 -16px -16px;background:none}
.tops .item{cursor:pointer}
@media (max-width:420px){.tabs{gap:0}.tabs button{padding:12px 4px;font-size:13.5px}}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.go button{display:grid;gap:4px;justify-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.go button b{font-size:14.5px}.go button span{font-size:12.5px;color:var(--muted)}
.go button:hover{border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:var(--brand-soft);border-radius:5px;padding:0 6px;margin-left:6px}
[hidden]{display:none!important}
.tools{display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select,textarea{width:100%;font:15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.sort{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sort select{width:auto;padding:6px 10px;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--brand-soft)}
.rank{font:700 15px var(--f-num);color:var(--muted);text-align:center}
.rank.r1{color:var(--gold)}.rank.r2{color:var(--silver)}.rank.r3{color:var(--bronze)}
.who{min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted)}
.ban{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--brand-soft);color:var(--accent);margin-right:6px}
.pts{font:700 18px var(--f-num);color:var(--accent)}
.pts small{font:500 11px var(--f-body);color:var(--muted);margin-left:2px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.count{font-size:13px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--surface);width:100%;max-width:720px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(24px + var(--sab))}
.panel h2{margin:0;font-size:20px}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-block:14px}
.stat div{flex:1 1 120px;background:var(--brand-soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 22px var(--f-num);color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font:600 14px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}
.closebar{display:flex;justify-content:space-between;align-items:start;gap:12px}
.pins{display:grid;gap:10px}
.pin{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:inherit;text-decoration:none}
.pin:hover{border-color:var(--accent)}
.pin .ico{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.pin > div{min-width:0}
.pin .t{font-weight:600}.pin .u{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 8px;font-size:16px}
.rules{white-space:pre-wrap;max-width:65ch;margin:0}
.hint{font-size:13px;color:var(--muted)}
.ok{color:var(--accent);font-weight:600}
.err{color:var(--bad);font-weight:600}

</style>
</head>

<?!= include('DungChung') ?>
<script>
/* Khi mở trong app cài trên điện thoại: trang vỏ báo khoảng an toàn để đầu và chân trang cân đối. */
(function () {
  var dau = true;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || d.eco !== 'vo' || !/^https:\/\//.test(e.origin) || e.source !== window.top) return;
    if (d.vien) { document.documentElement.style.setProperty('--sat', (Number(d.vien.t) || 0) + 'px'); document.documentElement.style.setProperty('--sab', (Number(d.vien.b) || 0) + 'px'); }
    if (dau) {
      dau = false;
      try {
        e.source.postMessage({ eco: 'ho-tro-vien' }, e.origin);
        // Thanh trạng thái màu xanh như đầu trang; phần dưới cùng màu nền sáng (không có vệt xanh ở đáy).
        e.source.postMessage({ eco: 'mau', mau: '#274e13', nen: '#f5f7f2', chan: '#f5f7f2' }, e.origin);
      } catch (x) {}
    }
  });
  if (window.top !== window) { try { window.top.postMessage({ eco: 'xin-chao' }, '*'); } catch (x) {} }
})();

var D = null, ban = 'Tất cả', q = '', dir = 'desc';
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ngay(ms) { var d = new Date(ms); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }

function boDau(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }

function napDuLieu(d) {
  D = d;
  $('loading').hidden = true;
  veTop();
  moTab(document.querySelector('[role=tab][aria-selected="true"]').getAttribute('data-tab'));
  $('term').textContent = d.ky ? 'Nhiệm kỳ ' + d.ky.nhiemKy + ' · Học kỳ ' + d.ky.hocKy : 'Chưa bắt đầu học kỳ';
  renderBans(); render();
  $('types').innerHTML = d.loaiHoatDong.map(function (l) { return '<tr><td>' + esc(l.ten) + (l.tuDong ? '<span class="tag">cộng tự động</span>' : '') + '</td><td class="n">' + l.diem + '</td></tr>'; }).join('') || '<tr><td colspan="2" class="hint">Chưa có loại hoạt động.</td></tr>';
  var qc = String(d.quyChe || '').trim();
  if (/^https:\/\/\S+$/.test(qc)) {
    $('rules').innerHTML = '<p style="margin:0 0 12px;color:var(--muted)">Quy chế cộng điểm nằm trong một file riêng.</p><a class="btn-link" target="_blank" rel="noopener"></a>';
    var a = $('rules').querySelector('a'); a.href = qc; a.textContent = 'Xem quy chế';
  } else {
    $('rules').innerHTML = '<p class="rules"></p>';
    $('rules').firstChild.textContent = qc || 'BOD chưa đăng quy chế.';
  }
  $('pins').innerHTML = d.ghim.length ? d.ghim.map(function (g) {
    return '<a class="pin" href="' + esc(g.link) + '" target="_blank" rel="noopener"><span class="ico">↗</span><div><div class="t">' + esc(g.tieuDe) + '</div><div class="u">' + esc(g.link) + '</div></div></a>';
  }).join('') : '<p class="hint">Chưa có link nào được ghim.</p>';
}

function veTop() {
  var ds = D.thanhVien.filter(function (p) { return p.diem > 0; }).sort(function (a, b) { return b.diem - a.diem; }).slice(0, 5);
  $('top').hidden = !ds.length;
  $('toplist').innerHTML = ds.map(function (p, i) {
    return '<button class="item" data-n="' + esc(p.ten) + '"><span class="rank ' + (i < 3 ? 'r' + (i + 1) : '') + '">' + (i + 1) + '</span><span class="who"><div class="name">' + esc(p.ten) + '</div><div class="meta"><span class="ban">' + esc(p.ban) + '</span></div></span><span class="pts">' + p.diem + '<small>điểm</small></span></button>';
  }).join('');
}
function moTab(k) {
  Array.prototype.forEach.call(document.querySelectorAll('[role=tab]'), function (x) { x.setAttribute('aria-selected', x.getAttribute('data-tab') === k); });
  ['home', 'diem', 'ghim', 'quyche', 'gopy'].forEach(function (t) { $('p-' + t).hidden = t !== k || (!D && t !== 'home' && t !== 'gopy'); });
  window.scrollTo(0, 0);
}

function renderBans() {
  var nhom = [];
  D.thanhVien.forEach(function (t) { if (t.nhom && nhom.indexOf(t.nhom) < 0) nhom.push(t.nhom); });
  nhom.sort(function (a, b) { return a.localeCompare(b); });
  $('bans').innerHTML = ['Tất cả'].concat(nhom).map(function (b) {
    return '<button class="chip" aria-pressed="' + (b === ban) + '" data-b="' + esc(b) + '">' + esc(b) + '</button>';
  }).join('');
}

function render() {
  var xepHang = D.thanhVien.slice().sort(function (a, b) { return b.diem - a.diem; });
  var hang = {}, truoc = null, h = 0;
  xepHang.forEach(function (p, i) { if (p.diem !== truoc) { h = i + 1; truoc = p.diem; } hang[p.ten] = h; });
  var tim = boDau(q);
  var rows = D.thanhVien.filter(function (p) { return (ban === 'Tất cả' || p.nhom === ban) && boDau(p.ten).indexOf(tim) >= 0; });
  rows.sort(function (a, b) { return dir === 'desc' ? b.diem - a.diem : a.diem - b.diem; });
  $('count').textContent = rows.length + ' thành viên';
  $('list').innerHTML = rows.length ? rows.map(function (p) {
    var r = hang[p.ten];
    return '<button class="item" data-n="' + esc(p.ten) + '"><span class="rank ' + (r <= 3 && p.diem > 0 ? 'r' + r : '') + '">' + r + '</span><span class="who"><div class="name">' + esc(p.ten) + '</div><div class="meta"><span class="ban">' + esc(p.ban) + '</span>' + (p.lop ? 'Lớp ' + esc(p.lop) : '') + '</div></span><span class="pts">' + p.diem + '<small>điểm</small></span></button>';
  }).join('') : '<div class="empty">' + (D.thanhVien.length ? 'Không có ai khớp với tìm kiếm.' : 'Chưa có danh sách thành viên.') + '</div>';
}

function moChiTiet(ten, hk1) {
  var p = D.thanhVien.filter(function (x) { return x.ten === ten; })[0];
  if (!p) return;
  $('panel').innerHTML = khungChiTiet(p, hk1, '<p class="hint">Đang tải lịch sử…</p>', null);
  $('sheet').hidden = false;
  ganNut(p);
  google.script.run
    .withSuccessHandler(function (ls) { $('panel').innerHTML = khungChiTiet(p, hk1, bangLichSu(ls), ls); ganNut(p); })
    .withFailureHandler(function () { $('panel').innerHTML = khungChiTiet(p, hk1, '<p class="err">Không tải được lịch sử. Bạn thử lại sau.</p>', null); ganNut(p); })
    .layLichSuBoard(ten, hk1 ? 1 : 0);
}

function khungChiTiet(p, hk1, than, ls) {
  var tong = hk1 ? p.diemHk1 : p.diem;
  var dem = {};
  (ls || []).forEach(function (x) { dem[x.loai] = (dem[x.loai] || 0) + 1; });
  var o = Object.keys(dem).map(function (k) { return '<div><b>' + dem[k] + '</b><span>lần ' + esc(k) + '</span></div>'; }).join('');
  return '<div class="closebar"><div><h2 id="dName">' + esc(p.ten) + '</h2><div class="meta"><span class="ban">' + esc(p.ban) + '</span>' + (p.lop ? 'Lớp ' + esc(p.lop) : '') + '</div></div><button class="btn ghost" id="close">Đóng</button></div>' +
    '<div class="stat"><div><b>' + tong + '</b><span>' + (hk1 ? 'Điểm học kỳ 1' : 'Tổng điểm học kỳ này') + '</span></div>' + o + '</div>' +
    (p.diemHk1 !== null ? '<div class="row" style="margin-bottom:12px"><button class="chip" aria-pressed="' + !hk1 + '" data-sem="0">Học kỳ này</button><button class="chip" aria-pressed="' + hk1 + '" data-sem="1">Xem điểm học kỳ 1</button></div>' : '') +
    than;
}

function bangLichSu(ls) {
  if (!ls.length) return '<p class="hint">Chưa có lần cộng điểm nào.</p>';
  return '<table><thead><tr><th>Ngày</th><th>Hoạt động</th><th style="text-align:right">Điểm</th></tr></thead><tbody>' + ls.map(function (h) {
    return '<tr><td style="white-space:nowrap">' + ngay(h.thoiGian) + '</td><td>' + esc(h.loai) + (h.ten ? ' <span class="meta">· ' + esc(h.ten) + '</span>' : '') + '</td><td class="n">+' + h.diem + '</td></tr>';
  }).join('') + '</tbody></table>';
}

function ganNut(p) {
  $('close').onclick = dong;
  Array.prototype.forEach.call($('panel').querySelectorAll('[data-sem]'), function (b) { b.onclick = function () { moChiTiet(p.ten, b.getAttribute('data-sem') === '1'); }; });
  $('close').focus();
}
function dong() { $('sheet').hidden = true; }

$('sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') dong(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') dong(); });
$('bans').addEventListener('click', function (e) { var b = e.target.closest('[data-b]'); if (!b) return; ban = b.getAttribute('data-b'); renderBans(); render(); });
$('q').addEventListener('input', function (e) { q = e.target.value; render(); });
$('sortSel').addEventListener('change', function (e) { dir = e.target.value; render(); });
$('list').addEventListener('click', function (e) { var b = e.target.closest('[data-n]'); if (b) moChiTiet(b.getAttribute('data-n'), false); });
$('toplist').addEventListener('click', function (e) { var b = e.target.closest('[data-n]'); if (b) moChiTiet(b.getAttribute('data-n'), false); });
Array.prototype.forEach.call(document.querySelectorAll('[role=tab]'), function (t) { t.onclick = function () { moTab(t.getAttribute('data-tab')); }; });
Array.prototype.forEach.call(document.querySelectorAll('[data-den]'), function (b) { b.onclick = function () { moTab(b.getAttribute('data-den')); if (b.getAttribute('data-den') === 'diem' && D) $('q').focus(); }; });
$('chao').innerHTML = khungChao('Bạn');
$('loading').innerHTML = cho();
$('fb').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = $('fbText').value.trim();
  if (!v) { $('fbMsg').innerHTML = '<span class="err">Bạn chưa viết gì.</span>'; return; }
  $('fbBtn').disabled = true;
  $('fbMsg').textContent = 'Đang gửi…';
  google.script.run
    .withSuccessHandler(function () { $('fbBtn').disabled = false; $('fbText').value = ''; $('fbMsg').innerHTML = '<span class="ok">Đã gửi góp ý. Cảm ơn bạn!</span>'; })
